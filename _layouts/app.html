<!doctype html>
<html lang="en">
  <head>
    {% include meta.html %}
    <script>
    window.addEventListener('load', (event) => {
        fathom.trackEvent('app: {{page.url}}');
    });
    </script>
    <style>
    /* CSS based loader, see more examples here https://projects.lukehaas.me/css-loaders/ */
    .loader,
    .loader:before,
    .loader:after {
    background: #6b6b6b;
    -webkit-animation: load1 1s infinite ease-in-out;
    animation: load1 1s infinite ease-in-out;
    width: 1em;
    height: 4em;
    }
    .loader {
    color: #6b6b6b;
    text-indent: -9999em;
    margin: 88px auto;
    position: relative;
    font-size: 11px;
    -webkit-transform: translateZ(0);
    -ms-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-animation-delay: -0.16s;
    animation-delay: -0.16s;
    }
    .loader:before,
    .loader:after {
    position: absolute;
    top: 0;
    content: "";
    }
    .loader:before {
    left: -1.5em;
    -webkit-animation-delay: -0.32s;
    animation-delay: -0.32s;
    }
    .loader:after {
    left: 1.5em;
    }
    @-webkit-keyframes load1 {
    0%,
    80%,
    100% {
        box-shadow: 0 0;
        height: 4em;
    }
    40% {
        box-shadow: 0 -2em;
        height: 5em;
    }
    }
    @keyframes load1 {
    0%,
    80%,
    100% {
        box-shadow: 0 0;
        height: 4em;
    }
    40% {
        box-shadow: 0 -2em;
        height: 5em;
    }
    }
    </style>
  </head>
  <body>
    {% if page.embed_url %}
    <div id="loader" class="text-center">
        <div class="loader"></div>
    </div>
    <iframe
        title="{{ page.title | strip_html }}"
        onload="document.getElementById('loader').style.display='none';"
        style="position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;"
        src="{{ page.embed_url }}"
    >
        Your browser doesn't support iframes
    </iframe>
    {% else %}
    {{ content }}
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      (function () {
        const themeToggle = document.querySelector('.theme-toggle');
        const root = document.documentElement;

        function updateTheme(theme) {
          const isLight = theme === 'light';
          root.dataset.theme = theme;
          localStorage.setItem('theme', theme);
          themeToggle.setAttribute('aria-label', `Switch to ${isLight ? 'dark' : 'light'} mode`);
          themeToggle.setAttribute('aria-pressed', String(isLight));
          document.querySelectorAll('.site-logo').forEach((logo) => {
            logo.src = isLight ? logo.dataset.lightLogo : logo.dataset.darkLogo;
          });
        }

        updateTheme(root.dataset.theme);
        themeToggle.addEventListener('click', () => {
          updateTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
        });
      }());
    </script>
    <script>
      (function () {
        const announcement = document.querySelector('[data-announcement]');

        if (!announcement) {
          return;
        }

        const storageKey = `announcement-dismissed:${announcement.dataset.announcementId}`;

        try {
          if (localStorage.getItem(storageKey) === 'true') {
            announcement.hidden = true;
            return;
          }
        } catch (error) {
          // Continue showing the announcement when local storage is unavailable.
        }

        announcement.querySelector('[data-announcement-close]').addEventListener('click', () => {
          announcement.hidden = true;

          try {
            localStorage.setItem(storageKey, 'true');
          } catch (error) {
            // Dismissal still applies for the current page when local storage is unavailable.
          }
        });
      }());
    </script>
  </body>
</html>
