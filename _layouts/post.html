---
layout: default
---
<main class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        {% if page.backlink %}<a class="text-decoration-none small text-uppercase fw-semibold tracking-wide" href="{{ page.backlink | relative_url }}">← Back to blog</a>{% endif %}
        <article class="mt-3">
          <header class="mb-4">
            <p class="text-secondary mb-2">{{ page.date | date: "%B %-d, %Y" }}</p>
            <h1 class="display-6 mb-3">{{ page.title }}</h1>
            {% if page.author %}
              <p class="mb-0 text-secondary">By {{ page.author }}</p>
            {% endif %}
          </header>
          <div class="post-content">
            {{ content | replace: '<!--truncate-->', '' }}
          </div>
          {% if page.tags %}
            <footer class="mt-4 pt-4 border-top border-white border-opacity-10">
              <div class="d-flex flex-wrap gap-2">
                {% for tag in page.tags %}
                  <span class="badge rounded-pill text-bg-dark border border-white border-opacity-10">{{ tag }}</span>
                {% endfor %}
              </div>
            </footer>
          {% endif %}
        </article>
      </div>
    </div>
  </div>
</main>
