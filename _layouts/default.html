<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/assets/images/logo.svg' | relative_url }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
      }());
    </script>
  </head>
  <body>
    {% if site.announcement.enabled and site.announcement.text %}
      <aside class="site-announcement" data-announcement data-announcement-id="{{ site.announcement.id | default: 'site-announcement' }}" aria-label="Site announcement">
        <div class="container site-announcement-content">
          <p class="mb-0">
            {{ site.announcement.text }}
            {% if site.announcement.link_text and site.announcement.link_url %}
              <a href="{{ site.announcement.link_url | relative_url }}">{{ site.announcement.link_text }}</a>
            {% endif %}
          </p>
          <button class="site-announcement-close" type="button" data-announcement-close aria-label="Dismiss announcement" title="Dismiss announcement">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
      </aside>
    {% endif %}
    {% include header.html %}

    {{ content }}

    {% include footer.html %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      (function () {
        const themeToggle = document.querySelector('.theme-toggle');
        const root = document.documentElement;

        function updateTheme(theme) {
          const isLight = theme === 'light';
          root.dataset.theme = theme;
          localStorage.setItem('theme', theme);
          themeToggle.setAttribute('aria-label', `Switch to ${isLight ? 'dark' : 'light'} mode`);
          themeToggle.setAttribute('aria-pressed', String(isLight));
          document.querySelectorAll('.site-logo').forEach((logo) => {
            logo.src = isLight ? logo.dataset.lightLogo : logo.dataset.darkLogo;
          });
        }

        updateTheme(root.dataset.theme);
        themeToggle.addEventListener('click', () => {
          updateTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
        });
      }());
    </script>
    <script>
      (function () {
        const announcement = document.querySelector('[data-announcement]');

        if (!announcement) {
          return;
        }

        const storageKey = `announcement-dismissed:${announcement.dataset.announcementId}`;

        try {
          if (localStorage.getItem(storageKey) === 'true') {
            announcement.hidden = true;
            return;
          }
        } catch (error) {
          // Continue showing the announcement when local storage is unavailable.
        }

        announcement.querySelector('[data-announcement-close]').addEventListener('click', () => {
          announcement.hidden = true;

          try {
            localStorage.setItem(storageKey, 'true');
          } catch (error) {
            // Dismissal still applies for the current page when local storage is unavailable.
          }
        });
      }());
    </script>
  </body>
</html>
