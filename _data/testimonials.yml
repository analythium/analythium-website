- contact_name: Dwight Kuo
  affiliation: Sr. Director, Bioinformatics, Alamar Biosciences
  testimonial: >-
    Analythium provided the know-how to build our software on top of a cloud-based infrastructure to access our analysis solution with unparalleled scalability. We highly recommend Analythium for their innovative solutions and exceptional service.
  full_testimonial: >-
    At Alamar Biosciences, we built NULISA Analysis Software, a solution to empower our customers with scalable proteomic analysis capabilities, but lacked the experience needed to build out the required infrastructure to support this. Analythium provided the know-how to build our software on top of a cloud-based infrastructure on Microsoft Azure, leveraging ShinyProxy and Kubernetes. Now, our customers can access our analysis solution with unparalleled ease and scalability. Moreover, Analythium's assistance in enhancing the UI of our Shiny application has streamlined our workflows and improved user satisfaction. We highly recommend Analythium for their innovative solutions and exceptional service.
