- contact_name: Sophie Czetwertynski
  affiliation: Ungulate Biologist, Fish and Wildlife Branch, Yukon Department of Environment
  testimonial: The team is exceptional at taking complex concepts and making them accessible by creating interfaces. I would not hesitate to recommend them for any statistical and programming project.
  full_testimonial: >-
    Dr. Peter Solymos has been contracted for various projects for the Yukon government over the past 10 years and every deliverable has exceeded expectations. He is exceptional at taking complex statistical concepts and making them accessible to biologist by creating interfaces that are efficient in the field yet flexible enough for post-survey modeling. Thanks to his work, the Yukon Moose Program has a field software that allows Regional Biologist to easily integrate multiple sources of data to optimally sample a landscape by helicopter and estimate moose population abundance and composition. His work has increased the Yukon's capacity to conduct moose surveys and we are extremely thankful for his skills. Overall, Dr. Solymos is a pleasure to work with, has endless patience towards the less statistically-inclined, and I would not hesitate to recommend him for any statistical and/or programming project.
  data: sophie-czetwertynski
  client: yukon-gov
  featured: yes
  services: ["data-science", "engineering", "training"]

