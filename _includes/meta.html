<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | escape }}">
{% assign social_image = page.thumbnail | default: site.thumbnail %}
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ social_image | absolute_url | escape }}">
<meta property="og:image:alt" content="{{ page.thumbnail_alt | default: page.title | default: site.title | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="twitter:image" content="{{ social_image | absolute_url | escape }}">
<link rel="icon" href="{{ '/assets/images/logo.svg' | relative_url }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    document.documentElement.dataset.theme = savedTheme || 'dark';
  }());
</script>
